name: evidence

# pull_request_target runs this workflow and the gate script from the BASE branch, so a PR
# cannot edit this job. The PR head is never checked out or executed here.
# The main-gates ruleset requires `check` and `evidence` from the GitHub Actions app (integration
# 15368). Another PR workflow with a job of the same name is also GitHub Actions, so that gap is
# narrowed, not closed (see AGENTS.md, "Known gate gaps").
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: PR body carries verdicts for this exact head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-evidence.mjs
