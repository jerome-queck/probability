name: evidence

# pull_request_target runs this workflow and the gate script from the BASE branch, so a PR
# cannot edit this job. The PR head is never checked out or executed here.
# Known gap: the main-gates ruleset requires the bare context names `check` and `evidence`, so a
# PR that adds another workflow with a job of the same name could satisfy it. Closing that needs a
# ruleset or review change on the repo (see AGENTS.md, "Known gate gaps").
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  # Transitional, for the PR that introduces pull_request_target only (the base branch has no
  # pull_request_target workflow yet). It still checks out the base commit, never the PR head.
  # Removed in the follow-up PR: a pull_request workflow comes from the PR's own tree, so a later PR could edit it.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: PR body carries verdicts for this exact head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-evidence.mjs
