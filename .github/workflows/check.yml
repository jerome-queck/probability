name: check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check:forbidden scans the whole history
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Pinned browser so screenshots match the committed baselines run to run.
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 154.0.8037.92
      - run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      # The one check command, identical to the local one (AGENTS.md).
      - run: npm run check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: artifacts/smoke
          if-no-files-found: ignore
      # TRANSITIONAL: main's evidence gate still looks for smoke-evidence until this PR merges.
      # Remove with the transitional evidence trigger in the follow-up PR.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: artifacts/smoke
          if-no-files-found: ignore
